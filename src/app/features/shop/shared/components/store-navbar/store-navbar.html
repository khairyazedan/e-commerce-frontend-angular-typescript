<!-- Announcement bar -->
<div
  class="bg-ut-orange text-ut-white text-center small fw-semibold py-2"
  style="letter-spacing: 0.08em"
>
  FREE SHIPPING ON ORDERS OVER $75 &nbsp;·&nbsp; NEW DROPS EVERY FRIDAY
</div>

<!-- Needs Bootstrap's JS bundle for the mobile menu (collapse) -->
<nav
  class="navbar navbar-expand-lg bg-ut-black sticky-top py-3"
  data-bs-theme="dark"
  aria-label="Main navigation"
>
  <div class="container">
    <!-- Brand -->
    <a routerLink="/" class="ut-brand fs-4 text-decoration-none me-lg-5"
      >URBAN<span>THREAD</span></a
    >

    <!-- Icons: search, account, cart, mobile menu button -->
    <div class="d-flex align-items-center gap-3 order-lg-last">
      <a routerLink="/search" class="ut-icon-btn" aria-label="Search"
        ><i class="bi bi-search"></i
      ></a>
      @if (user) {
        <a
          [routerLink]="accountLink"
          class="ut-icon-btn d-none d-sm-inline"
          aria-label="My account"
        >
          <i class="bi bi-person"></i>
        </a>
      }

      <a routerLink="cart" class="ut-icon-btn position-relative" aria-label="Cart, 3 items">
        <i class="bi bi-bag"></i>
        <span
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-ut-orange"
          >3</span
        >
      </a>

      <button
        class="navbar-toggler border-0 ms-1"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#storeNav"
        aria-controls="storeNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <!-- Links -->
    <div class="collapse navbar-collapse" id="storeNav">
      <ul class="navbar-nav me-auto mt-3 mt-lg-0">
        <li class="nav-item">
          <a class="nav-link ut-nav-link active" routerLink="/shop?sort=newest">New In</a>
        </li>
        <li class="nav-item">
          <a class="nav-link ut-nav-link" routerLink="/shop?gender=men">Men</a>
        </li>
        <li class="nav-item">
          <a class="nav-link ut-nav-link" routerLink="/shop?gender=women">Women</a>
        </li>
        <li class="nav-item">
          <a class="nav-link ut-nav-link" routerLink="/shop?gender=kids">Kids</a>
        </li>
        <li class="nav-item">
          <a class="nav-link ut-nav-link" routerLink="/shop?sale=true">Sale</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
